name: Build & Publish

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: 'Publish package to NuGet.org'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore -c Release

      - name: Run Tests
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Pack NuGet Package
        run: |
          mkdir -p ./artifacts
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "Packing version $VERSION from git tag..."
            dotnet pack src/RalfHuesing.Mcp.Observability/RalfHuesing.Mcp.Observability.csproj --no-build -c Release -p:PackageVersion=$VERSION -o ./artifacts
          else
            dotnet pack src/RalfHuesing.Mcp.Observability/RalfHuesing.Mcp.Observability.csproj --no-build -c Release -o ./artifacts
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*

      - name: Authenticate with NuGet.org (Trusted Publishing)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_to_nuget == true)
        uses: NuGet/login@v1
        with:
          owner: RalfHuesing

      - name: Publish to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_to_nuget == true)
        run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
